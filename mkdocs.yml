site_name: Clausal
site_description: Logic programming embedded in Python

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/gitlab

nav:
  - Home: index.md
  - Getting Started:
    - Project Goals: goals.md
    - Tutorial: tutorial.md
    - Syntax: syntax.md
    - Testing: testing.md
  - Language:
    - Predicates: predicates.md
    - Lambdas: lambdas.md
    - If-Then-Else: reified_ite.md
    - DCGs: dcg.md
    - Dicts and Sets: dicts_sets.md
    - Exceptions: exceptions.md
    - Coroutining: coroutining.md
    - Directives: directives.md
  - Builtins:
    - Predicate Index: builtins.md
    - Type Checking: type_checking.md
    - Arithmetic: arithmetic.md
    - Lists: lists.md
    - Pairs: pairs.md
    - Higher-Order: higher_order.md
    - Meta-Predicates: meta_predicates.md
    - Term Inspection: term_inspection.md
    - Database Operations: database_ops.md
    - Keyword Predicates: keyword_preds.md
    - Control: control.md
    - I/O: io.md
    - Logging: logging.md
  - Constraints:
    - Dif & CLP(FD): constraints.md
    - CLP(B): clpb.md
    - CLP(R): clpr.md
  - Standard Library:
    - Random: random.md
    - JSON: json.md
    - CSV: csv.md
    - OS: os.md
    - Files: files.md
    - Process: process.md
    - Regex: regex.md
    - Date & Time: date_time.md
    - YAML: yaml.md
    - SQLite: sqlite.md
    - spaCy NLP: spacy.md
    - UUIDs: uuid.md
    - Crypto: crypto.md
    - HTTP & URL: http.md
    - TCP: tcp.md
    - Graphs: graphs.md
    - scikit-learn: sklearn.md
    - SymPy: sympy.md
    - Units: units.md
    - scipy.special: scipy_special.md
    - scipy.linalg: scipy_linalg.md
    - scipy.optimize: scipy_optimize.md
    - scipy.stats: scipy_stats.md
    - scipy.integrate: scipy_integrate.md
    - scipy.interpolate: scipy_interpolate.md
    - scipy.fft: scipy_fft.md
    - scipy.ndimage: scipy_ndimage.md
    - scipy.spatial: scipy_spatial.md
    - scipy.constants: scipy_constants.md
    - scipy.differentiate: scipy_differentiate.md
    - scipy.signal: scipy_signal.md
    - scipy.sparse: scipy_sparse.md
    - scipy.cluster: scipy_cluster.md
  - Advanced:
    - Module System: import.md
    - Regex: regex.md
    - Term & Goal Expansion: term_expansion.md
    - Python Interop: python_integration.md
    - Tabling: tabling.md
    - Well-Founded Semantics: wfs.md
    - Meta-Interpreters: metainterpreters.md
  - Internals:
    - Architecture: architecture.md
    - Compiler: compiler.md
    - Indexing: indexing.md
    - Caching: caching.md
    - Specialization: specialization.md
  - Prolog Translation: prolog_translation.md
  - IPython / Jupyter: ipython.md
  - Examples: examples.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/clausal/
