[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal-provenance"
version = "0.1.0"
description = "Provenance-tagged bottom-up Datalog for Clausal — semirings from plain Boolean Datalog through to PyTorch/JAX-differentiable probabilistic inference"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "clausal>=1.0",
]

[project.optional-dependencies]
# The bridges move arrays through numpy; torch does not require it.
torch = ["torch>=2.0", "numpy"]
jax = ["jax>=0.4", "jaxlib>=0.4", "numpy"]
all = ["torch>=2.0", "jax>=0.4", "jaxlib>=0.4", "numpy"]

[project.urls]
Repository = "https://gitlab.com/MikeAmy/clausal"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]

# Namespace packages: no __init__.py at clausal/ or clausal/modules/ —
# these are owned by the core distribution. setuptools discovers them
# as implicit namespace packages (PEP 420). The provenance subpackage
# at clausal/modules/provenance/ does have its own __init__.py.
