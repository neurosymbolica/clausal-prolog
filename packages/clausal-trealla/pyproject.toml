[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal-trealla"
version = "0.1.0"
description = "Trealla Prolog backend for Clausal"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "clausal>=0.3.1",
]

[project.urls]
Repository = "https://gitlab.com/MikeAmy/clausal"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]
