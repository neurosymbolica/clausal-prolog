[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal-sklearn"
version = "0.1.0"
description = "scikit-learn predicates for Clausal (machine learning wrappers)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "clausal>=1.0",
    "scikit-learn",
    "clausal-scipy>=0.1.0",
]

[project.urls]
Homepage = "https://clausal.pl"
Documentation = "https://github.com/neurosymbolica/clausal-prolog/blob/main/packages/clausal-sklearn/README.md"
Repository = "https://gitlab.com/MikeAmy/clausal"
GitHub = "https://github.com/neurosymbolica/clausal-prolog/tree/main/packages/clausal-sklearn"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]

# Namespace packages: no __init__.py at clausal/, clausal/modules/ —
# these are owned by the core distribution.
# setuptools discovers them as implicit namespace packages (PEP 420).
