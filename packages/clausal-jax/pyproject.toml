[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal-jax"
version = "0.1.0"
description = "JAX predicates for Clausal (array, PRNG, transforms, sharding, scipy)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "clausal>=0.3.1",
    "jax",
    "jaxlib",
]

[project.optional-dependencies]
optax = ["optax"]
equinox = ["equinox"]
flax = ["flax"]

[project.urls]
Repository = "https://gitlab.com/MikeAmy/clausal"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]

# Namespace packages: no __init__.py at clausal/, clausal/modules/ —
# these are owned by the core distribution.
# setuptools discovers them as implicit namespace packages (PEP 420).
