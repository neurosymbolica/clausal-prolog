[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal-jax"
version = "0.1.0"
description = "JAX predicates for Clausal (array, PRNG, transforms, sharding, scipy)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "clausal>=1.0",
    "jax",
    "jaxlib",
    "numpy",   # jax_numpy/2 imports it directly
]

[project.optional-dependencies]
test = ["optax", "equinox", "flax"]   # what the full test suite needs
optax = ["optax"]
equinox = ["equinox"]
flax = ["flax"]

[project.urls]
Homepage = "https://clausal.pl"
Documentation = "https://github.com/neurosymbolica/clausal-prolog/blob/main/packages/clausal-jax/README.md"
Repository = "https://gitlab.com/MikeAmy/clausal"
GitHub = "https://github.com/neurosymbolica/clausal-prolog/tree/main/packages/clausal-jax"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]

# Namespace packages: no __init__.py at clausal/, clausal/modules/ —
# these are owned by the core distribution.
# setuptools discovers them as implicit namespace packages (PEP 420).
