[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal-opencv"
version = "0.1.0"
description = "OpenCV (cv2) predicates for Clausal"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "clausal>=1.0",
    # OpenCV 5 moved KAZE/AKAZE/BRISK, HOGDescriptor and CascadeClassifier
    # out of the main package (to opencv-contrib); this adapter uses them.
    "opencv-python<5",
    "numpy",
]

[project.urls]
Homepage = "https://clausal.pl"
Documentation = "https://github.com/neurosymbolica/clausal-prolog/blob/main/packages/clausal-opencv/README.md"
Repository = "https://gitlab.com/MikeAmy/clausal"
GitHub = "https://github.com/neurosymbolica/clausal-prolog/tree/main/packages/clausal-opencv"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]

# Namespace packages: no __init__.py at clausal/, clausal/modules/ —
# these are owned by the core distribution.
# setuptools discovers them as implicit namespace packages (PEP 420).
