[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal-gprolog"
version = "0.1.0"
description = "GNU Prolog backend for Clausal (C extension)"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "clausal>=1.0,<1.1",
]

[project.urls]
Repository = "https://gitlab.com/MikeAmy/clausal"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]
