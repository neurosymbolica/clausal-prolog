[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal"
version = "0.1.0"
description = "A Prolog-style logic programming DSL embedded in Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "greenlet",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
spacy = ["spacy>=3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]

[tool.pytest.ini_options]
pythonpath = ["."]
