[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausal"
version = "0.4.0"
description = "A Prolog-style logic programming DSL embedded in Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Amy", email = "mikeamycoder@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "greenlet",
]

[project.urls]
Repository = "https://gitlab.com/MikeAmy/clausal"

[project.optional-dependencies]
yaml = ["clausal-yaml>=0.1.0"]
spacy = ["clausal-spacy>=0.1.0"]
ptpython = ["ptpython>=3.0"]
repl = ["ptpython>=3.0"]

[project.scripts]
clausal-repl = "clausal.python_repl:main"
clausal-install-ipython = "clausal._install_ipython:main"
clausal-fmt = "clausal.fmt.cli:main"
clausal-rewrite = "clausal.rewrite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clausal*"]

[tool.pytest.ini_options]
pythonpath = ["."]
timeout = 10
timeout_method = "thread"
